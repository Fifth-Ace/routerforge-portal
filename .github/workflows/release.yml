name: Release (Chromium)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout exact tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Gate exact version, tag and main ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = Fifth-Ace/routerforge-portal
          VERSION="$(node -p "JSON.parse(require('fs').readFileSync('manifest.json','utf8')).version")"
          test "$GITHUB_REF_TYPE" = tag
          test "$GITHUB_REF_NAME" = "v${VERSION}"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Verify, build and checksum exact tag
        shell: bash
        run: |
          set -euo pipefail
          npm run lint
          npm test
          python3 tools/security_gate.py
          python3 tools/package_release.py
          python3 tests/test_chromium_prod.py
          VERSION="$(node -p "require('./package.json').version")"
          mkdir -p publish
          cp "dist/routerforge-portal-v${VERSION}-install.zip" "publish/routerforge-portal-chromium-v${VERSION}.zip"
          ( cd publish && sha256sum routerforge-portal-chromium-*.zip > SHA256SUMS.txt )
      - name: Attest Chromium asset
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4 pinned
        with:
          subject-path: publish/routerforge-portal-chromium-*.zip
      - name: Publish only new immutable release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo RELEASE_ALREADY_EXISTS;exit 1;fi
          gh release create "$GITHUB_REF_NAME" publish/routerforge-portal-chromium-*.zip publish/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "RouterForge Portal $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
