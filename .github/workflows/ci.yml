name: CI (Chromium)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned
        with:
          persist-credentials: false
      - name: Syntax, tests, security
        run: |
          set -euo pipefail
          npm run lint
          npm test
          python3 tools/security_gate.py
      - name: Build Chromium twice and compare exact ZIP hash
        run: |
          set -euo pipefail
          python3 tools/package_release.py
          python3 tests/test_chromium_prod.py
          sha256sum dist/routerforge-portal-*.zip > /tmp/first.sha256
          python3 tools/package_release.py
          python3 tests/test_chromium_prod.py
          sha256sum dist/routerforge-portal-*.zip > /tmp/second.sha256
          diff -u /tmp/first.sha256 /tmp/second.sha256
          echo CHROMIUM_REPRODUCIBLE_PASS
